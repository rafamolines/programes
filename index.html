<!doctype html>
<html lang="ca">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <title>Saltador</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <section class="topbar" aria-label="Marcador">
        <div>
          <span class="label">Punts</span>
          <strong id="score">0</strong>
        </div>
        <div class="top-actions">
          <button id="soundButton" type="button" aria-label="Activa o desactiva el so">So</button>
          <button id="pauseButton" type="button" aria-label="Pausa la partida">Pausa</button>
          <button id="restartButton" type="button" aria-label="Reinicia la partida">Reinicia</button>
        </div>
      </section>

      <section class="stage">
        <canvas id="game" aria-label="Joc de saltar obstacles"></canvas>
        <div id="menu" class="menu">
          <h1>Saltador</h1>
          <p>Salta obstacles, suma punts i aguanta cada vegada mes velocitat.</p>
          <button id="startButton" class="primary-button" type="button">Comenca</button>
        </div>
      </section>

      <section class="controls">
        <button id="jumpButton" class="jump-button" type="button">Salta</button>
      </section>
    </main>

    <script src="src/game.js"></script>
  </body>
</html>
